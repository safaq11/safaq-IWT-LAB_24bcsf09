PROFILE
<html>
<head>
    <title>My Personal Portfolio</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #dfe9f3, #ffffff);
        }

        .portfolio-card {
            width: 400px;
            background: #ffffff;
            margin: 60px auto;
            padding: 30px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 5px solid #4CAF50;
            object-fit: cover;
            margin-bottom: 15px;
        }

        h1 {
            margin: 10px 0 5px;
        }

        h3 {
            margin: 0;
            color: #4CAF50;
            font-weight: normal;
        }

        .about {
            margin: 15px 0;
            color: #555;
            font-size: 14px;
        }

        .skills {
            margin-top: 20px;
        }

        .skills span {
            display: inline-block;
            background: #4CAF50;
            color: white;
            padding: 6px 12px;
            margin: 5px;
            border-radius: 20px;
            font-size: 12px;
        }

        .social-icons {
            margin-top: 20px;
        }

        .social-icons a {
            text-decoration: none;
            margin: 0 10px;
            font-size: 18px;
            color: #4CAF50;
            font-weight: bold;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #388e3c;
        }
    </style>
</head>
<body>

    <div class="portfolio-card">
        <img src="winters.jpg" alt="Profile Photo" class="profile-img">

        <h1>Safaq Jamal</h1>
        <h3>Web Developer</h3>

        <p class="about">
            Passionate web developer who loves creating modern, responsive,
            and user-friendly websites. Always learning new technologies.
        </p>

        <div class="skills">
            <span>HTML</span>
            <span>CSS</span>
            <span>React</span>
        </div>

        <div class="social-icons">
            <a href="#">LinkedIn</a>
            <a href="#">GitHub</a>
            <a href="#">Instagram</a>
        </div>

        <a href="#" class="btn">Contact Me</a>
    </div>

</body>
</html>
